name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this job to clone the repo and create a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that's already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      # Builds with `npm run build` and uploads dist/ as the Pages artifact.
      # astro.config.mjs reads GITHUB_REPOSITORY to set `site` and `base`.
      - name: Install, build and upload
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
